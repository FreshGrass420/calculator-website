<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Scientific</a>
        <a href="bmi.html">BMI</a>
        <a href="compound.html">Compound</a>
        <a href="mortgage.html">Mortgage</a>
        <a href="temperature.html">Temperature</a>
        <a href="apy.html">APY</a>
    </nav>
    <div class="calculator">
        <h2>Scientific Calculator</h2>
        <input type="text" id="sci-display" readonly>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
            <button onclick="document.getElementById('sci-display').value += '7'">7</button>
            <button onclick="document.getElementById('sci-display').value += '8'">8</button>
            <button onclick="document.getElementById('sci-display').value += '9'">9</button>
            <button onclick="document.getElementById('sci-display').value += '/'">/</button>
            <button onclick="document.getElementById('sci-display').value += '4'">4</button>
            <button onclick="document.getElementById('sci-display').value += '5'">5</button>
            <button onclick="document.getElementById('sci-display').value += '6'">6</button>
            <button onclick="document.getElementById('sci-display').value += '*'">*</button>
            <button onclick="document.getElementById('sci-display').value += '1'">1</button>
            <button onclick="document.getElementById('sci-display').value += '2'">2</button>
            <button onclick="document.getElementById('sci-display').value += '3'">3</button>
            <button onclick="document.getElementById('sci-display').value += '-'">-</button>
            <button onclick="document.getElementById('sci-display').value += '0'">0</button>
            <button onclick="document.getElementById('sci-display').value += '.'">.</button>
            <button onclick="document.getElementById('sci-display').value = eval(document.getElementById('sci-display').value)">=</button>
            <button onclick="document.getElementById('sci-display').value += '+'">+</button>
        </div>
    </div>
    <footer>&copy; <span id="year"></span> Calculator Website</footer>
    <script src="script.js"></script>

    <!-- End Cloudflare Web Analytics -->
</body>
</html>
