    <div class="calculator">
        <h2>Compound Interest Calculator</h2>
        <input type="number" id="compound-principal" placeholder="Principal ($)">
        <input type="number" id="compound-rate" placeholder="Annual Rate (%)">
        <input type="number" id="compound-time" placeholder="Time (years)">
        <select id="compound-n">
            <option value="1">Annually</option>
            <option value="12">Monthly</option>
            <option value="365">Daily</option>
        </select>
        <button onclick="calcCompound()">Calculate</button>
        <div class="result" id="compound-result"></div>
