<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcPro - Mortgage Calculator</title>
    <meta name="description" content="Calculate your monthly mortgage payments, total interest, and loan summary">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🧮 CalcPro</h1>
            <p>Your Ultimate Free Online Calculator Suite</p>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="container">
            <div class="nav-links">
                <a href="index.html">Scientific</a>
                <a href="bmi.html">BMI</a>
                <a href="compound.html">Compound Interest</a>
                <a href="mortgage.html" class="active">Mortgage</a>
                <a href="temperature.html">Temperature</a>
                <a href="apy.html">APY</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="ad-box">📢 Ad Space - 728x90 Banner</div>

        <section class="section">
            <h2>🏠 Mortgage Calculator</h2>
            <div class="calc-grid">
                <div>
                    <div class="input-group"><label>Home Price ($)</label><input type="number" id="mg-price" placeholder="300000"></div>
                    <div class="input-group"><label>Down Payment ($)</label><input type="number" id="mg-down" placeholder="60000"></div>
                    <div class="input-group"><label>Interest Rate (%)</label><input type="number" id="mg-rate" placeholder="6.5"></div>
                    <div class="input-group"><label>Loan Term (years)</label><input type="number" id="mg-years" value="30"></div>
                    <button class="btn-calc" onclick="calcMortgage()">Calculate</button>
                </div>
                <div class="result-box" id="mg-result" style="display:none;">
                    <h3>Mortgage Summary</h3>
                    <div class="result-value" id="mg-monthly"></div>
                    <p style="margin-top:10px;">Loan Amount: <strong id="mg-loan"></strong></p>
                    <p>Total Interest: <strong id="mg-interest"></strong></p>
                    <p>Total Paid: <strong id="mg-total"></strong></p>
                </div>
            </div>
        </section>

        <div class="ad-box">📢 Ad Space - 728x90 Banner</div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 CalcPro - Free Online Calculators</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
