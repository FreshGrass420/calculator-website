<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APY Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Scientific</a>
        <a href="bmi.html">BMI</a>
        <a href="compound.html">Compound</a>
        <a href="mortgage.html">Mortgage</a>
        <a href="temperature.html">Temperature</a>
        <a href="apy.html">APY</a>
    </nav>
    <div class="calculator">
        <h2>APY Calculator</h2>
        <input type="number" id="apy-principal" placeholder="Initial Deposit ($)">
        <input type="number" id="apy-rate" placeholder="Interest Rate (%)">
        <div style="display: flex; gap: 5px;">
            <input type="number" id="apy-term" placeholder="Term" style="flex: 2;">
            <select id="apy-term-unit" style="flex: 1;">
                <option value="y">Years</option>
                <option value="m">Months</option>
                <option value="w">Weeks</option>
                <option value="d">Days</option>
            </select>
        </div>
        <select id="apy-frequency">
            <option value="365">Daily</option>
            <option value="52">Weekly</option>
            <option value="12">Monthly</option>
            <option value="4">Quarterly</option>
            <option value="1">Annually</option>
        </select>
        <button onclick="calcAPY()">Calculate APY</button>
        <div class="result">
            <p>Final Amount: <span id="apy-final"></span></p>
            <p>Total Interest: <span id="apy-interest"></span></p>
            <p>Effective Yield: <span id="apy-effective"></span></p>
            <p>Growth Multiplier: <span id="apy-multiplier"></span></p>
            <p>Daily Interest: <span id="apy-daily"></span></p>
            <p>Time to Double: <span id="apy-double"></span></p>
        </div>
    </div>
    <footer>&copy; <span id="year"></span> Calculator Website</footer>
    <script src="script.js"></script>
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e698996f14194ecea9198e165afc4b70"}'></script>
    <!-- End Cloudflare Web Analytics -->
</body>
</html>
