<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcPro - BMI Calculator</title>
    <meta name="description" content="Calculate your Body Mass Index (BMI) and check your health category">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🧮 CalcPro</h1>
            <p>Your Ultimate Free Online Calculator Suite</p>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="container">
            <div class="nav-links">
                <a href="index.html">Scientific</a>
                <a href="bmi.html" class="active">BMI</a>
                <a href="compound.html">Compound Interest</a>
                <a href="mortgage.html">Mortgage</a>
                <a href="temperature.html">Temperature</a>
                <a href="apy.html">APY</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="ad-box">📢 Ad Space - 728x90 Banner</div>

        <section class="section">
            <h2>📊 BMI Calculator</h2>
            <div class="calc-grid">
                <div>
                    <div class="input-group"><label>Height (cm)</label><input type="number" id="bmi-height" placeholder="175"></div>
                    <div class="input-group"><label>Weight (kg)</label><input type="number" id="bmi-weight" placeholder="70"></div>
                    <button class="btn-calc" onclick="calcBMI()">Calculate BMI</button>
                </div>
                <div class="result-box" id="bmi-result" style="display:none;">
                    <h3>Your BMI</h3>
                    <div class="result-value" id="bmi-value"></div>
                    <p id="bmi-category" style="margin-top:10px;font-size:1.1em;"></p>
                    <p id="bmi-range" style="margin-top:5px;color:#666;"></p>
                </div>
            </div>
        </section>

        <div class="ad-box">📢 Ad Space - 728x90 Banner</div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 CalcPro - Free Online Calculators</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
